name: Channel delivery

# Feature branches and open PRs intentionally start no CI. Merging a PR pushes
# to a delivery channel, which validates, packages, and releases that commit.
on:
  push:
    branches: [main, nightly, dev]

permissions:
  contents: read

# Serial publishing per channel; later commits never cancel an in-flight release.
concurrency:
  group: dash-channel-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: dash-backend/go.mod
          cache-dependency-path: dash-backend/go.sum
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make build-env-check
      - run: npm ci
      - run: make check
      - name: Verify native OTA activation and rollback under device limits
        run: make sandbox-up && make ota-smoke
      - name: Verify build-yourself SSH installer with mocked transport
        run: make source-install-smoke
      - name: Build device release archives
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-release
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: device-release
          path: .artifacts/release/
      - name: Publish complete build, then advance its channel feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs
