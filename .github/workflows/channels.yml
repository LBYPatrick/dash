name: Channel delivery

# Feature branches and open PRs intentionally start no CI. Merging a PR pushes
# to a delivery channel, which validates, packages, and releases that commit.
on:
  push:
    branches: [main, nightly, dev]

permissions:
  contents: read

# Serial publishing per channel; later commits never cancel an in-flight release.
concurrency:
  group: dash-channel-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  media:
    name: Media (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/media/linux-${{ matrix.arch }}
          key: dash-media-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/media/**') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/filesystems/linux-${{ matrix.arch }}
          key: dash-filesystems-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/filesystems/**') }}
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg exfatprogs ntfs-3g e2fsprogs
          sudo modprobe fuse
          sudo modprobe loop
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and exercise native static media tools
        env:
          MEDIA_ARCH: ${{ matrix.arch }}
        run: make build-media media-smoke build-filesystems filesystem-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: filesystems-${{ matrix.arch }}
          path: .artifacts/filesystems/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}
          path: .artifacts/media/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  build:
    needs: media
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          run-install: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: vp install --frozen-lockfile
      - run: make build-env-check
      - run: make check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: linux-*
          path: .artifacts/media/
      - name: Restore executable permissions on verified media artifacts
        run: chmod +x .artifacts/media/linux-*/ffmpeg .artifacts/media/linux-*/ffprobe
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: filesystems-*
          path: .artifacts/filesystems-download/
      - name: Restore verified USB filesystem artifacts
        run: |
          mkdir -p .artifacts/filesystems
          for arch in arm64 amd64; do
            mv ".artifacts/filesystems-download/filesystems-$arch" ".artifacts/filesystems/linux-$arch"
            chmod +x ".artifacts/filesystems/linux-$arch/mount.exfat-fuse" ".artifacts/filesystems/linux-$arch/ntfs-3g"
          done
      - name: Verify native OTA activation and rollback under device limits
        run: make sandbox-up && make ota-smoke && DASH_ARCHIVE_RESTART=1 make archive-smoke
      - name: Verify build-yourself SSH installer with mocked transport
        run: make source-install-smoke
      - name: Build device release archives
        env:
          DASH_GOOGLE_CLIENT_ID: ${{ secrets.DASH_GOOGLE_CLIENT_ID }}
          DASH_GOOGLE_CLIENT_SECRET: ${{ secrets.DASH_GOOGLE_CLIENT_SECRET }}
          DASH_MICROSOFT_CLIENT_ID: ${{ secrets.DASH_MICROSOFT_CLIENT_ID }}
        run: go -C backend run ./cmd/dash-tool release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-release
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: device-release
          path: .artifacts/release/
      - name: Publish complete build, then advance its channel feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: go -C backend run ./cmd/dash-tool publish
